[project]
name = "desaint"
version = "0.1.0"
description = "Desaint Stationeries Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "asgiref>=3.8.0",
    "sqlparse>=0.5.0",
    "whitenoise>=6.6.0",
    "dj-database-url>=2.1.0",
]

[tool.vercel]
entrypoint = "wsgi:app"
