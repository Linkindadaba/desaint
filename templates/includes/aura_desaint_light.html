<!-- Aura Gradient: "Desaint Alabaster Aurora" with Tactile Paper Weave Grain Overlay (Light Theme) -->
<div class="fixed-aura-bg aura-light-container aura-desaint-light aura-sapphire-container aura-dusty-rose-container" aria-hidden="true">
    <div class="aura-layer-1" aria-hidden="true"></div>
    <div class="aura-layer-2" aria-hidden="true"></div>
    <div class="aura-grain" aria-hidden="true">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <filter id="grain-desaint-light">
                <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
                <feColorMatrix type="matrix" values="0.12 0.45 0.28 0 0
                                                    0.12 0.45 0.28 0 0
                                                    0.12 0.45 0.28 0 0
                                                    0    0    0    1 0"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#grain-desaint-light)"/>
        </svg>
    </div>
</div>
