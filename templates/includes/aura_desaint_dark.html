<!-- Aura Gradient: "Desaint Obsidian Crimson Aurora" with Fine Grain Overlay (Dark Theme) -->
<div class="fixed-aura-bg aura-dark-container aura-desaint-dark aura-nightfall-container" aria-hidden="true">
    <div class="aura-dark-layer-1" aria-hidden="true"></div>
    <div class="aura-dark-layer-2" aria-hidden="true"></div>
    <div class="aura-dark-layer-3" aria-hidden="true"></div>
    <div class="aura-dark-grain" aria-hidden="true">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <filter id="grain-desaint-dark">
                <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
                <feColorMatrix type="matrix" values="0.16 0.52 0.08 0 0.05
                                                    0.16 0.52 0.08 0 0.05
                                                    0.16 0.52 0.08 0 0.05
                                                    0    0    0    1 0"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#grain-desaint-dark)"/>
        </svg>
    </div>
</div>
